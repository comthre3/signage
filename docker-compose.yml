version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sawwii
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sawwii
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sawwii -d sawwii"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Shared state for rate limiting across backend workers. Deliberately has no
  # published port (reachable only on the compose network) and no volume: every
  # key here is ephemeral counter data that is cheaper to lose than to persist.
  # allkeys-lru bounds memory so a burst of distinct keys can never OOM it.
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  renderer:
    build: ./renderer
    environment:
      - RENDERER_TOKEN=${RENDERER_TOKEN}
      - RENDERER_MAX_CONCURRENCY=2
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      # WALLS_PHASE2_ENABLED=true to expose the spanned-wall wizard option.
      - WALLS_PHASE2_ENABLED=${WALLS_PHASE2_ENABLED:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3

  player:
    build:
      context: ./player
      args:
        PLAYER_VERSION: ${PLAYER_VERSION:-dev}
    ports:
      - "${PLAYER_PORT:-3001}:80"
    depends_on:
      - backend
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3

  landing:
    build: ./landing
    ports:
      - "${LANDING_PORT:-3003}:80"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
