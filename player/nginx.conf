# WebSocket support for wall mode (Task 14, multi-screen walls phase 1):
# Player opens wss://api.khanshoof.com/walls/{wall_id}/ws for wall sync.
# api.khanshoof.com is fronted by Cloudflare Tunnel which handles the
# WebSocket Upgrade handshake natively, so no nginx-layer Upgrade/Connection
# headers are needed in this repo. CSP connect-src below explicitly allows
# wss:// because some browsers (Firefox, older Tizen/WebOS WebKit) don't
# auto-extend an https:// allow rule to the wss:// scheme.
# frame-src https: exists so a "website" media item can actually render. Without
# it every external iframe falls back to default-src 'self' and is blocked, which
# shows as a black screen while the player reports it is playing normally. The
# embedded page runs on its own origin, so it cannot read this one's storage or
# screen token, and frame-ancestors below still stops the player being framed.
# Operators choose what they embed; only https is permitted, never plain http.
#
# frame-ancestors names the dashboard origin (substituted at container start
# from $APP_URL) so the Screens "Preview" panel can embed the player. It was
# 'none', which made that panel permanently blank. X-Frame-Options is
# deliberately NOT set on the player: it has no working allow-list — ALLOW-FROM
# was never supported by Chrome or Safari — so DENY is its only usable value
# and it would veto the preview no matter what frame-ancestors said.
# frame-ancestors is XFO's designated successor and is honoured by every
# browser capable of running this player. The player therefore remains
# un-frameable by every origin except our own dashboard.
#
# __API_ORIGIN__ / __API_WS_ORIGIN__ are substituted at container start from
# $API_BASE_URL — the same variable that feeds config.js — so a self-hosted
# player (e.g. API at http://<tailnet-host>:8000) can reach its API and play its
# uploads. img-src, media-src and frame-src (PDFs) name it because https: does
# not cover a plain-http API; that is the operator's own API, not arbitrary http.
map $sent_http_content_type $khan_csp {
    default                "default-src 'self'; img-src 'self' data: https: __API_ORIGIN__; media-src 'self' https: __API_ORIGIN__; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' __API_ORIGIN__ __API_WS_ORIGIN__; frame-src https: __API_ORIGIN__; frame-ancestors __APP_URL__";
}

# Stylesheets and images. Asked for as ?v=<this build's version> (index.html's
# stylesheet, and everything the service worker precaches), the URL names these
# exact bytes, so Cloudflare and browsers may keep it for a year. Any other URL
# -- the plain name, an older version, a made-up one -- is revalidated on every
# request. It used to be cached for 7 days, so after a deploy Cloudflare kept
# serving the old styles.css with the new player.js until someone purged it.
# Only the current version is cached long, so nobody can fill Cloudflare's
# cache with old bytes under a version that isn't live yet.
# __PLAYER_VERSION__ is filled in at container start, as in sw.js.
map $arg_v $khan_static_cache {
    "__PLAYER_VERSION__"   "public, max-age=31536000, immutable";
    default                "no-cache";
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary       on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $khan_csp always;

    location ~* \.(html|js)$ {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $khan_csp always;
    }

    location ~* \.(css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
        add_header Cache-Control $khan_static_cache always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $khan_csp always;
    }
}
