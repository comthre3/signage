# frame-src exists so the Screens "Preview" panel can embed the player. Without
# it the iframe falls back to default-src 'self' and is blocked, which shows as
# an empty preview panel with no error anywhere in the UI. __PLAYER_BASE_URL__
# is substituted at container start from $PLAYER_BASE_URL — the same variable
# that feeds config.js — so the policy and the URL the app actually frames can
# never drift apart. Only the player is embeddable here, never arbitrary https.
# frame-ancestors 'none' and X-Frame-Options DENY below are unchanged: the
# dashboard itself still refuses to be framed by anyone.
# media-src exists so the media picker and wall canvas can preview videos, which
# are served from the API origin, not this one. Without it <video> falls back to
# default-src 'self' and is blocked, which shows as a blank thumbnail.
# __API_ORIGIN__ / __API_WS_ORIGIN__ are substituted at container start from
# $API_BASE_URL, like __PLAYER_BASE_URL__, so a self-hosted deployment (e.g.
# http://<tailnet-host>:8000) is not locked out of its own API. img-src names it
# too: https: already covers a TLS API, but not a plain-http one.
map $sent_http_content_type $khan_csp {
    default                "default-src 'self'; img-src 'self' data: https: __API_ORIGIN__; media-src 'self' __API_ORIGIN__; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' __API_ORIGIN__ __API_WS_ORIGIN__; frame-src __PLAYER_BASE_URL__; frame-ancestors 'none'";
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary       on;

    # Cross-Origin-Opener-Policy: a page on another site that opens the
    # dashboard (window.open) gets no handle to it, so it cannot navigate the
    # dashboard tab mid-sign-in -- e.g. to an /auth-bounce link of its own.
    # Sign-in with Google/Apple and KNET payment are top-level navigations and
    # nothing here relies on window.opener, so they are unaffected.
    # nginx drops server-level add_header lines in any location that sets its
    # own, which is why each location below repeats the whole set.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy $khan_csp always;

    location ~* \.(html|js)$ {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy $khan_csp always;
    }

    location ~* \.(css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy $khan_csp always;
    }
}
