<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@500;700&family=IBM+Plex+Serif:wght@700&display=swap">
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
  body{background:#3E2B4F;color:#FFF8F0;font-family:'IBM Plex Sans',sans-serif;display:grid;grid-template-columns:1.05fr 1fr}
  .left{padding:90px 100px;display:flex;flex-direction:column;gap:28px}
  h1{font-family:'IBM Plex Serif',serif;font-size:96px;margin:0;line-height:1}
  .ar{font-family:'IBM Plex Sans Arabic',sans-serif;font-size:56px;color:#F4B9A1;margin:0}
  .tag{font-size:32px;color:#E8DCC6;margin:0 0 20px}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:26px}
  li{display:flex;align-items:baseline;gap:18px;font-size:44px}
  li span.dots{flex:1;border-bottom:4px dotted rgba(255,248,240,.35);transform:translateY(-10px)}
  li b{font-weight:600;color:#FDF3D6}
  .right{background:radial-gradient(700px 500px at 60% 40%,#F4B9A1,transparent 70%),#E09478;display:flex;align-items:center;justify-content:center;position:relative}
  .cup{width:520px;height:520px;border-radius:50%;background:#FFF8F0;display:flex;align-items:center;justify-content:center;box-shadow:0 40px 80px rgba(62,43,79,.35)}
  .cup div{width:400px;height:400px;border-radius:50%;background:radial-gradient(circle at 45% 40%,#D9A066,#8A5A2B 70%)}
  .offer{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#3E2B4F;color:#FFF8F0;font-size:40px;padding:22px 44px;border-radius:999px;white-space:nowrap}
</style></head>
<body>
  <div class="left">
    <h1>Karak &amp; Co.</h1>
    <p class="ar">كرك وشركاه</p>
    <p class="tag">Freshly brewed, all day</p>
    <ul>
      <li>Karak tea <span class="dots"></span><b>0.250 KD</b></li>
      <li>Saffron latte <span class="dots"></span><b>1.500 KD</b></li>
      <li>Cardamom cold brew <span class="dots"></span><b>1.750 KD</b></li>
      <li>Date &amp; tahini cake <span class="dots"></span><b>1.250 KD</b></li>
      <li>Zaatar croissant <span class="dots"></span><b>0.900 KD</b></li>
    </ul>
  </div>
  <div class="right">
    <div class="cup"><div></div></div>
    <div class="offer">2 karaks for 0.400 KD before 10am</div>
  </div>
</body></html>
